# kind runs each Kubernetes "node" as a Docker container on your Mac.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000   # Traefik "web" NodePort      → http://…  on your Mac
        hostPort: 80
        listenAddress: "127.0.0.1"
      - containerPort: 30443   # Traefik "websecure" NodePort → https://… on your Mac
        hostPort: 443
        listenAddress: "127.0.0.1"
      - containerPort: 30080   # NodePort inside the cluster
        hostPort: 30080        # port on your Mac → http://localhost:30080
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
